    <style>
      /* Critical CSS for instant loading skeleton */
      #loading-skeleton {
        position: fixed;
        inset: 0;
        background: #1a1a1a;
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 9999;
      }
      .spinner {
        width: 48px;
        height: 48px;
        border: 4px solid rgba(212, 175, 55, 0.2);
        border-top-color: #d4af37;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
      .loading-text {
        color: rgba(255, 255, 255, 0.6);
        margin-top: 16px;
        font-family: system-ui, -apple-system, sans-serif;
        font-size: 14px;
      }
    </style>
    <div id="loading-skeleton" style="display: none;">
      <div style="display: flex; flex-direction: column; align-items: center; gap: 16px;">
        <div class="spinner"></div>
        <div class="loading-text">Loading Lubdan...</div>
      </div>
    </div>
    <div id="root"></div>
    <noscript>This site requires JavaScript to be enabled.</noscript>
    <!-- Transak Widget - Deferred to improve performance -->
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Remove loading skeleton when React mounts
      (function() {
        var checkInterval = setInterval(function() {
          var root = document.getElementById('root');
          var skeleton = document.getElementById('loading-skeleton');
          if (root && root.children.length > 0 && skeleton) {
            clearInterval(checkInterval);
            skeleton.style.opacity = '0';
            skeleton.style.transition = 'opacity 0.3s ease-out';
            setTimeout(function() { 
              if (skeleton.parentNode) skeleton.parentNode.removeChild(skeleton); 
            }, 300);
          }
        }, 50);
        // Fallback: remove after 10 seconds
        setTimeout(function() {
          clearInterval(checkInterval);
          var skeleton = document.getElementById('loading-skeleton');
          if (skeleton && skeleton.parentNode) skeleton.parentNode.removeChild(skeleton);
        }, 10000);
      })();
    </script>
